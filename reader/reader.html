<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>読める Reader</title>
    <link rel="stylesheet" href="reader.css" />
  </head>
  <body>
    <div class="reader-toolbar">
      <div class="toolbar-left">
        <a class="toolbar-logo" href="reader.html" data-i18n-title="sessionsHome">読める</a>
      </div>
      <div class="toolbar-center">
        <button id="deleteSelBtn" class="toolbar-btn danger" hidden>
          Delete (0)
        </button>
        <button id="annotateBtn" class="toolbar-btn primary">
          <img src="../icons/furigana.svg" class="toolbar-icon" alt="" />
          <span data-i18n="annotate">注音</span>
        </button>
        <button id="translateBtn" class="toolbar-btn primary">
          <img src="../icons/translate.svg" class="toolbar-icon" alt="" />
          <span data-i18n="translate">翻訳</span>
        </button>
        <button id="cancelBtn" class="toolbar-btn danger" data-i18n="cancel" hidden>
          Cancel
        </button>
        <button id="quizBtn" class="toolbar-btn quiz" data-i18n="quiz">
          Quiz
        </button>
        <span id="progress" class="progress-text"></span>
      </div>
      <div class="toolbar-right">
        <a
          id="originalLink"
          class="toolbar-btn secondary"
          target="_blank"
          rel="noreferrer"
          data-i18n="openOriginal"
          hidden
          >Open original</a
        >
      </div>
      <div id="toolbarProgress" class="toolbar-progress" hidden>
        <div id="toolbarProgressFill" class="toolbar-progress-fill"></div>
      </div>
    </div>
    <div id="hint" class="prep-banner" data-i18n="selectHint">
      Click to select, Shift+click for range, then delete
    </div>
    <div class="reader-layout" id="readerLayout">
      <article id="reader-content" class="reader-content" lang="ja">
        <h1 id="reader-title" class="reader-title"></h1>
        <div id="reader-body"></div>
        <section id="sessionHome" class="session-home" hidden>
          <h2 data-i18n="recentSessions">Recent sessions</h2>
          <ul id="sessionList" class="session-list"></ul>
          <p id="sessionEmpty" class="session-empty" hidden>
            <span data-i18n="noSessions">No saved sessions yet</span><br />
            <span data-i18n="sessionEmptyHint"
              >Paste Japanese text above, or use Reader Mode from the popup on any
              page.</span
            >
          </p>
        </section>
      </article>
      <aside id="quiz-panel" class="quiz-panel" hidden>
        <div class="quiz-panel-header">
          <h2 data-i18n="quizTitle">Reading Comprehension</h2>
          <button id="quizCloseBtn" class="quiz-close">&times;</button>
        </div>
        <div id="quiz-body" class="quiz-body"></div>
      </aside>
    </div>
    <div id="ttsBar" class="tts-bar">
      <div id="ttsProgressTrack" class="tts-progress-track">
        <div id="ttsProgressFill" class="tts-progress-fill"></div>
        <div id="ttsProgressThumb" class="tts-progress-thumb"></div>
      </div>
      <div class="tts-controls">
        <div class="tts-controls-left">
          <span id="ttsCurrentTime" class="tts-time">0:00</span>
          <span class="tts-time-sep">/</span>
          <span id="ttsTotalTime" class="tts-time">--:--</span>
        </div>
        <div class="tts-controls-center">
          <button id="ttsPrevBtn" class="tts-ctrl-btn" data-i18n-title="prevParagraph" title="Previous paragraph">⏮</button>
          <button id="ttsPlayBtn" class="tts-ctrl-btn tts-play-btn">▶</button>
          <span id="ttsLoadingText" class="tts-loading-text" hidden></span>
          <button id="ttsNextBtn" class="tts-ctrl-btn" data-i18n-title="nextParagraph" title="Next paragraph">⏭</button>
        </div>
        <div class="tts-controls-right">
          <select id="ttsSpeedSelect" class="tts-speed-select">
            <option value="0.5">0.5×</option>
            <option value="0.75">0.75×</option>
            <option value="1" selected>1×</option>
            <option value="1.25">1.25×</option>
            <option value="1.5">1.5×</option>
            <option value="2">2×</option>
          </select>
          <button id="ttsCloseBtn" class="tts-ctrl-btn tts-close-btn" title="停止">✕</button>
        </div>
      </div>
    </div>
    <script src="../lib/shared.js"></script>
    <script type="module" src="reader.js"></script>
  </body>
</html>
